<div id="profil-formasi-card" class="space-y-3 rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
  <h3 class="text-base font-semibold text-slate-800">Identitas & Formasi Seleksi CPNS/PPPK</h3>

  <div>
    <label for="namaPeserta" class="block text-sm font-medium text-slate-700">Nama Peserta</label>
    <input
      id="namaPeserta"
      type="text"
      placeholder="Contoh: Best D Pamungkas"
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"
    />
  </div>

  <div>
    <label for="formasiDilamar" class="block text-sm font-medium text-slate-700">Formasi yang Dilamar</label>
    <input
      id="formasiDilamar"
      list="daftarFormasi"
      type="text"
      placeholder="Contoh: Terampil - Pranata Komputer"
      oninput="perbaruiDeskripsiOtomatis()"
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"
    />
    <datalist id="daftarFormasi">
      <option value="Terampil - Pranata Komputer"></option>
      <option value="Ahli Pertama - Pranata Komputer"></option>
      <option value="Penata Layanan Operasional"></option>
      <option value="Analis Kebijakan"></option>
      <option value="Analis Sumber Daya Manusia Aparatur"></option>
    </datalist>
  </div>

  <div>
    <label for="instansiDilamar" class="block text-sm font-medium text-slate-700">Instansi yang Dilamar (Nama Lengkap)</label>
    <input
      id="instansiDilamar"
      list="daftarInstansi"
      type="text"
      value="Kementerian Pertahanan"
      placeholder="Contoh: Kementerian Pertahanan"
      oninput="perbaruiDeskripsiOtomatis()"
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"
    />
    <datalist id="daftarInstansi">
      <option value="Kementerian Pertahanan"></option>
      <option value="Kementerian Keuangan"></option>
      <option value="Kementerian Dalam Negeri"></option>
      <option value="Badan Kepegawaian Negara"></option>
    </datalist>
  </div>

  <div>
    <label for="deskripsiFormasi" class="block text-sm font-medium text-slate-700">Deskripsi Formasi & Instansi (Otomatis)</label>
    <textarea
      id="deskripsiFormasi"
      rows="3"
      readonly
      class="mt-1 w-full rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-700"
    ></textarea>
  </div>
</div>

<script>
  const deskripsiKhususFormasi = {
    "terampil - pranata komputer":
      "mendukung pengelolaan tata kelola teknologi informasi, dukungan sistem dan jaringan, administrasi serta pengolahan data/informasi kedinasan secara akurat dan akuntabel.",
    "ahli pertama - pranata komputer":
      "melaksanakan analisis, perancangan, implementasi, dan evaluasi sistem informasi serta tata kelola teknologi informasi di lingkungan instansi.",
    "penata layanan operasional":
      "mendukung kelancaran layanan administrasi, tata usaha, koordinasi operasional, dan pengelolaan data pendukung unit kerja."
  };

  function buatDeskripsiFormasi(formasi, instansi) {
    const fBersih = (formasi || "").trim() || "Formasi yang dilamar";
    const iBersih = (instansi || "").trim() || "Instansi terkait";
    const kunci = fBersih.toLowerCase();

    const uraianTugas =
      deskripsiKhususFormasi[kunci] ||
      "melaksanakan tugas pokok dan fungsi aparatur sipil negara secara profesional, berintegritas, serta berorientasi pada pelayanan publik.";

    return `Peserta mengikuti simulasi CAT SKD untuk formasi ${fBersih} pada instansi ${iBersih}, dengan peran ${uraianTugas}`;
  }

  function perbaruiDeskripsiOtomatis() {
    const formasi = document.getElementById("formasiDilamar").value;
    const instansi = document.getElementById("instansiDilamar").value;
    document.getElementById("deskripsiFormasi").value = buatDeskripsiFormasi(formasi, instansi);
  }

  // Inisialisasi saat halaman dimuat
  perbaruiDeskripsiOtomatis();

  // Contoh payload saat ujian selesai dan dikirim ke Google Apps Script
  async function kirimHasilCAT(endpointUrl, hasilUjian) {
    const payload = {
      namaPeserta: document.getElementById("namaPeserta").value.trim() || "Peserta CAT",
      formasiDilamar: document.getElementById("formasiDilamar").value.trim() || "-",
      instansiDilamar: document.getElementById("instansiDilamar").value.trim() || "Kementerian Pertahanan",
      deskripsiFormasi: document.getElementById("deskripsiFormasi").value.trim(),
      modeUjian: hasilUjian.modeUjian,
      skorTWK: hasilUjian.skorTWK,
      skorTIU: hasilUjian.skorTIU,
      skorTKP: hasilUjian.skorTKP,
      totalSkor: hasilUjian.totalSkor,
      statusPG: hasilUjian.statusPG
    };

    await fetch(endpointUrl, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
  }
</script>
